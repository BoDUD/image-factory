[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "image-factory"
version = "0.2.0"
description = "Local template driven image production workbench"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "Pillow>=11,<13", "openpyxl>=3.1,<4", "qrcode>=8,<9", "pywin32>=308;sys_platform=='win32'"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.12"]

[project.scripts]
image-factory = "image_factory.app:main"

[tool.setuptools.package-data]
image_factory = ["*.jsx"]

[tool.setuptools.packages.find]
include = ["image_factory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
